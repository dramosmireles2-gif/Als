<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Página no encontrada | Als Dress Reynosa</title>
  <script>
    // Links viejos del sitio anterior (/beneficios, /ubicacion…): se mandan a su sección del inicio
    (function () {
      var viejas = ['/coleccion', '/beneficios', '/preguntas', '/contacto', '/visita', '/ubicacion'];
      var ruta = location.pathname.replace(/\/+$/, '');
      if (viejas.indexOf(ruta) !== -1) location.replace('/?p=' + encodeURIComponent(ruta));
    })();
  </script>
{{> head-comun}}
{{> gtag}}
  <link rel="stylesheet" href="/src/styles/index.css">
</head>
<body data-pagina="404">

{{> header}}

  <main id="contenido">
    <section class="error404" aria-labelledby="titulo404">
      <h1 class="info__titulo" id="titulo404">Esta página no existe</h1>
      <p class="info__intro">Puede que el link haya cambiado. Busca tu vestido por ocasión o escríbenos y te ayudamos.</p>
      <ul class="chip-grupo" aria-label="Buscar por ocasión">
        <li><a class="chip" href="/catalogo/?ocasion=xv">XV años</a></li>
        <li><a class="chip" href="/catalogo/?ocasion=graduacion">Graduación</a></li>
        <li><a class="chip" href="/catalogo/?ocasion=boda">Boda</a></li>
        <li><a class="chip" href="/catalogo/?ocasion=gala">Gala</a></li>
      </ul>
      <div class="cierre__acciones">
        <a class="btn btn--primario" href="/catalogo/">Ver catálogo</a>
        <a class="btn btn--wa-numero" href="https://wa.me/528991947566?text=Hola%2C%20estaba%20en%20su%20p%C3%A1gina%20buscando%20un%20vestido.%20%C2%BFMe%20ayudan%3F" target="_blank" rel="noopener"><img src="/wa.svg" alt="" width="28" height="28">Escríbenos</a>
      </div>
      <a class="enlace" href="/">Ir al inicio</a>
    </section>
  </main>

{{> footer}}
</body>
</html>
